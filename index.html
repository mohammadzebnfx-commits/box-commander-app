<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BOX">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>BOX Commander</title>
<style>
/* One column, thumb-first: lines on top, quick actions, box actions, live feed. */
:root{
  --bg:#f3f4f1; --card:#ffffff; --fg:#1b1f1c; --muted:#69716b; --line:#dfe3dc;
  --gold:#b8860b; --gold-ink:#ffffff; --ok:#1f7a4d; --warn:#b45309; --bad:#b42318;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --sans:-apple-system,"SF Arabic","Geeza Pro",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e100f; --card:#181b19; --fg:#eef1ec; --muted:#8e978f; --line:#2a2f2b;
  --gold:#e0b341; --gold-ink:#16130a; --ok:#4cc38a; --warn:#f0a23b; --bad:#ff6b5e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e100f; --card:#181b19; --fg:#eef1ec; --muted:#8e978f; --line:#2a2f2b;
  --gold:#e0b341; --gold-ink:#16130a; --ok:#4cc38a; --warn:#f0a23b; --bad:#ff6b5e; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--sans);
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
main,.stack{display:flex;flex-direction:column;gap:12px}
main{max-width:560px;margin:0 auto}
[hidden]{display:none!important}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:20px;margin:0;letter-spacing:.5px}
h1 b{color:var(--gold)}
h2{font-size:13px;margin:0 0 8px;color:var(--muted);font-weight:600}
.pill{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.pill.live{color:var(--ok);border-color:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
input{width:100%;font:600 20px var(--mono);padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);direction:ltr;text-align:center}
input:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button{font:600 15px var(--sans);border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:12px;padding:13px 8px;cursor:pointer}
button:active{transform:scale(.98)}
button.primary{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-size:17px}
button.danger{color:var(--bad);border-color:var(--bad)}
button.armed{background:var(--bad);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chips{display:flex;gap:6px}
.chips button{padding:8px 0;flex:1;font-family:var(--mono)}
.chips button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
#status{white-space:pre-wrap;font-size:14px;margin:0;min-height:3em}
#feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto}
#feed li{border-top:1px solid var(--line);padding-top:8px;white-space:pre-wrap;overflow-wrap:anywhere}
#feed time{font:12px var(--mono);color:var(--muted);margin-inline-start:6px}
#feed b{font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;max-width:90vw}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
textarea{width:100%;font:13px var(--mono);padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);direction:ltr;min-height:70px}
@media (prefers-reduced-motion:reduce){button:active{transform:none}}
</style>
</head>
<body>
<main>
  <header>
    <h1><b>BOX</b> Commander</h1>
    <span id="conn" class="pill">غير متصل</span>
  </header>

  <section class="card" id="setup" hidden>
    <h2>الإعداد (مرة وحدة)</h2>
    <label for="code">الصق كود الإعداد</label>
    <textarea id="code" placeholder="cmd-topic|alert-topic|PIN"></textarea>
    <p class="hint">الكود بيتخزن على تلفونك بس، مش بالصفحة.</p>
    <button class="primary" id="saveCode" style="width:100%;margin-top:8px">حفظ</button>
  </section>

  <div id="app" class="stack" hidden>
  <section class="card">
    <h2>الخطين</h2>
    <div class="row">
      <div><label for="up">فوق</label><input id="up" inputmode="decimal" placeholder="4068.45"></div>
      <div><label for="dn">تحت</label><input id="dn" inputmode="decimal" placeholder="4034.13"></div>
    </div>
    <label style="margin-top:10px">لوت البوكس</label>
    <div class="chips" id="lots">
      <button aria-pressed="true" data-lot="0.01">0.01</button>
      <button aria-pressed="false" data-lot="0.02">0.02</button>
      <button aria-pressed="false" data-lot="0.03">0.03</button>
    </div>
    <button class="primary" id="sendLines" style="width:100%;margin-top:10px">ابعت الخطين</button>
    <p class="hint">أول شمعة M1 بتلمس خط ← بوكس عليها لما تسكّر ← أول إغلاق برّا بيدخل.</p>
  </section>

  <section class="card">
    <h2>الحالة</h2>
    <pre id="status">اكبس "حالة"</pre>
    <div class="grid" style="margin-top:10px">
      <button data-cmd="status">📊 حالة</button>
      <button data-cmd="pause">⏸ وقف</button>
      <button data-cmd="resume">▶️ كمّل</button>
      <button data-cmd="line off">〰️ الغي الخطوط</button>
      <button class="danger" data-cmd="close all" data-confirm="1">سكّر الكل</button>
      <button class="danger" data-cmd="stop" data-confirm="1">🛑 وقف كامل</button>
    </div>
  </section>

  <section class="card">
    <h2>بوكس</h2>
    <div class="row" style="align-items:end">
      <div style="flex:0 0 90px"><label for="boxNo">رقم</label><input id="boxNo" inputmode="numeric" placeholder="1"></div>
      <button data-box="be">ستوب ع الدخول</button>
      <button data-box="half">سكّر نص</button>
      <button class="danger" data-box="close" data-confirm="1">سكّر</button>
    </div>
  </section>

  <section class="card">
    <h2>آخر الأخبار من البوت</h2>
    <ul id="feed"></ul>
  </section>
  <button id="reset" style="background:none;border:none;color:var(--muted);font-size:12px">تغيير الإعداد</button>
  </div>
</main>
<div class="toast" id="toast" hidden></div>
<script>
const NTFY = "https://ntfy.sh";
let cfg = null, lot = "0.01", es = null, armed = null;
const $ = id => document.getElementById(id);

function load(){ try { cfg = JSON.parse(localStorage.getItem("boxcfg") || "null"); } catch(e){ cfg = null; } }
function toast(t){ const el=$("toast"); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2600); }

async function send(text){
  if(!cfg) return;
  try{
    const r = await fetch(`${NTFY}/${cfg.c}`, {method:"POST", body:`${cfg.p} ${text}`});
    toast(r.ok ? "انبعت ✓ الرد جاي…" : "ما انبعت: "+r.status);
  }catch(e){ toast("ما في نت؟ ما انبعت"); }
}

function addFeed(m){
  if(!m || m.event!=="message") return;
  if((m.title||"").includes("📊")) $("status").textContent = m.message;
  const li=document.createElement("li");
  const t=new Date(m.time*1000).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
  const b=document.createElement("b"); b.textContent=(m.title||"BOX")+" ";
  const tm=document.createElement("time"); tm.textContent=t;
  li.append(b,tm,document.createElement("br"),document.createTextNode(m.message||""));
  $("feed").prepend(li);
  while($("feed").children.length>40) $("feed").lastChild.remove();
}

async function connect(){
  try{
    const r = await fetch(`${NTFY}/${cfg.a}/json?poll=1&since=12h`);
    const txt = await r.text();
    txt.split("\n").filter(Boolean).forEach(l=>{ try{ addFeed(JSON.parse(l)); }catch(e){} });
  }catch(e){}
  if(es) es.close();
  es = new EventSource(`${NTFY}/${cfg.a}/sse`);
  es.onopen = ()=>{ $("conn").textContent="متصل"; $("conn").classList.add("live"); };
  es.onerror = ()=>{ $("conn").textContent="بيعيد الاتصال…"; $("conn").classList.remove("live"); };
  es.onmessage = e=>{ try{ addFeed(JSON.parse(e.data)); }catch(x){} };
}

function confirmTap(btn, run){
  if(btn.dataset.confirm!=="1") return run();
  if(armed===btn){ armed=null; btn.classList.remove("armed"); btn.textContent=btn.dataset.label; return run(); }
  if(armed){ armed.classList.remove("armed"); armed.textContent=armed.dataset.label; }
  armed=btn; btn.dataset.label=btn.textContent; btn.textContent="اكبس كمان مرة"; btn.classList.add("armed");
  setTimeout(()=>{ if(armed===btn){ armed=null; btn.classList.remove("armed"); btn.textContent=btn.dataset.label; } },4000);
}

function start(){
  load();
  $("setup").hidden = !!cfg;
  $("app").hidden = !cfg;
  if(cfg) connect();
}

$("saveCode").onclick = ()=>{
  const parts = $("code").value.trim().split("|").map(s=>s.trim());
  if(parts.length!==3 || !parts[0] || !parts[1] || !/^\d{4}$/.test(parts[2])){ toast("الكود مش كامل"); return; }
  try{ localStorage.setItem("boxcfg", JSON.stringify({c:parts[0],a:parts[1],p:parts[2]})); }catch(e){ toast("التلفون ما سمح بالحفظ"); return; }
  start();
};
$("reset").onclick = ()=>{ try{ localStorage.removeItem("boxcfg"); }catch(e){} cfg=null; if(es) es.close(); start(); };

$("lots").onclick = e=>{
  const b=e.target.closest("button"); if(!b) return;
  lot=b.dataset.lot;
  [...$("lots").children].forEach(x=>x.setAttribute("aria-pressed", x===b?"true":"false"));
};
$("sendLines").onclick = ()=>{
  const up=$("up").value.trim().replace(",","."), dn=$("dn").value.trim().replace(",",".");
  const ok=v=>v==="" || /^\d+(\.\d+)?$/.test(v);
  if((!up && !dn) || !ok(up) || !ok(dn)){ toast("اكتب خط أو خطين صح"); return; }
  send(`line ${[up,dn].filter(Boolean).join(" ")} lot ${lot}`);
};
document.querySelectorAll("[data-cmd]").forEach(b=> b.onclick=()=>confirmTap(b,()=>send(b.dataset.cmd)));
document.querySelectorAll("[data-box]").forEach(b=> b.onclick=()=>{
  const n=$("boxNo").value.trim();
  if(!/^\d+$/.test(n)){ toast("اكتب رقم البوكس"); return; }
  confirmTap(b,()=>send(`${b.dataset.box} ${n}`));
});
start();
</script>
</body>
</html>
